# データベース接続情報（環境変数があれば優先、なければローカル値を使用）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/menulog_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:menulog_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}

# PostgreSQL用のドライバを明示指定
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA) の設定
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# サーバーポート（Render用環境変数PORTがあれば優先、なければ8084）
server.port=${PORT:8084}